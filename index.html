<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skribl - A notes application</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <header>
    <img src="img/text2.png" alt="Skribl Logo">
    <a href="https://github.com/matthewblott/skribl" target="_blank" rel="referrer" class="github-link">Fork me on GitHub</a>
  </header>
    <main>
      <section>
        <h1>For when you just need to Skribl something down!</h1>
        <p>Capture ideas instantly with fingertip drawing. Sketch shapes, write text, and organize personal notes. Ideal for quick visual brainstorming on iPhone and iPad.</p>
        <nav>
          <a class="app-link" href="https://skribl.coderscoffeehouse.com" target="_blank" rel="noreferrer">
            Get started
          </a>
          <a href="https://apps.apple.com/us/app/skribl/id6757318403" target="_blank" rel="noreferrer">
            <img src="img/app-store.svg" alt="Download on the App Store" width="180">
          </a>
          <a href="#" target="_blank" rel="noreferrer">
            <img src="img/f-droid-cropped.svg" alt="Get it on F-Droid" width="180">
          </a>
        </nav>
      </section>
      <figure>
        <img src="img/note-selected.png" alt="Skribl mobile app showing handwritten notes">
      </figure>
    </main>
</body>
</html>
